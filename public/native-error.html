<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <title>LIA is unavailable</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#fff;color:#111827;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{min-height:100vh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}.card{max-width:390px;text-align:center}.icon{width:68px;height:68px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#fff7ed;color:#ea580c;font-size:34px;font-weight:800}.title{margin:22px 0 8px;font-size:23px}.copy{margin:0;color:#4b5563;line-height:1.6}.retry{width:100%;min-height:50px;margin-top:24px;border:0;border-radius:999px;background:#f97316;color:white;font-weight:800;font-size:15px}.help{display:inline-block;margin-top:18px;color:#374151;font-weight:700;text-decoration:none}
    </style>
  </head>
  <body>
    <main class="page"><section class="card"><div class="icon">!</div><h1 class="title">LIA couldn’t connect</h1><p class="copy">Internet access is required. Check your connection and try again. If LIA is temporarily unavailable, your information remains safe.</p><button class="retry" onclick="location.href='https://www.liamarketplace.com/home'">Try again</button><a class="help" href="https://www.liamarketplace.com/help?from=customer">Contact LIA Support</a></section></main>
  </body>
</html>
